# =============================================================================
# VeilTalk TURN/STUN 服务器配置（coturn）
# 挂载路径：容器内 /etc/coturn/turnserver.conf（见 deploy/docker-compose.yml）
# 修改后生效：docker compose -f deploy/docker-compose.yml restart coturn
# 官方文档：https://github.com/coturn/coturn/wiki/turnserver
# =============================================================================

# ------------------------------ 监听端口 -------------------------------------
listening-port=3478
# TLS/DTLS 监听端口：仅在按下方"TLS 进阶"配置证书后取消注释
#tls-listening-port=5349

# 监听/中继 IP：容器内 0.0.0.0 表示全部网卡（host 网络模式同样适用）
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# --------------------- 对外通告地址 external-ip（关键！）----------------------
# coturn 分配中继端口时，会把这个地址写进分配请求的响应里告诉浏览器。
# 若通告错了，浏览器会拿到"连不上"的 relay 候选，表现为 TURN 中继永远失败。
#
# 场景一：服务器网卡直接持有公网 IP（少数裸金属/部分 VPS）
#external-ip=203.0.113.10
#
# 场景二：云服务器只有内网 IP，公网 IP 绑在云网关/NAT 上（绝大多数云主机！）
#         必须用 <公网IP>/<内网IP> 形式：
#external-ip=203.0.113.10/10.0.0.5
#
# 部署后请按服务器实际情况取消注释并填写，否则公网环境下中继大概率不通。

# ------------------------------ relay 端口段 ----------------------------------
# 与 docker-compose.yml 暴露的 49152-49255 保持一致；两端务必同步修改
min-port=49152
max-port=49255

# ------------------------------ 鉴权方式 --------------------------------------
# 方案（默认启用）：long-term credential 长期凭证
#   - 浏览器凭 /api/ice-config 下发的 username/password 直接鉴权；
#   - deploy.sh 会生成随机密码写入 .env（TURN_USERNAME/TURN_CREDENTIAL），
#     并把同一对凭证同步改写下面这行（行首 user= 标记勿删）。
fingerprint
lt-cred-mech
realm=veiltalk.local

# 长期凭证：<用户名>:<密码>。占位符由 deploy.sh 用 .env 中的值自动替换；
# 手动维护时：改这里的同时，同步更新 .env 的 TURN_USERNAME / TURN_CREDENTIAL。
user=veiltalk:CHANGE_ME_RUN_DEPLOY_SH

# 进阶方案（静态鉴权 secret + REST API 临时凭证，见 DEPLOYMENT.md 第 6.2 节）：
#   ★ bash deploy.sh up --turn-rest 可自动完成下面的全部切换（第 16 轮），无需手工改本文件
#   1) 注释掉上面的 lt-cred-mech 与 user 两行（两种机制互斥，同时开会导致启动报错）；
#   2) 取消注释下面两行，secret 由 deploy.sh 写入 .env 的 TURN_SHARED_SECRET；
#   3) /api/ice-config 已原生支持（第 15 轮）：检测到 TURN_SHARED_SECRET 环境变量时，
#      自动按 coturn REST 约定签发短时凭证（username=<过期时间戳>:veiltalk，
#      credential=base64(HMAC-SHA1(secret, username))，默认 1h 有效，TURN_CREDENTIAL_TTL 可调）。
#use-auth-secret
#static-auth-secret=CHANGE_ME_RUN_DEPLOY_SH

# ------------------------------ TLS 进阶（可选）-------------------------------
# WebRTC 媒体走 DTLS 自加密，TURN over TLS(5349) 主要用于：严格防火墙只放行 443/5349
# 的企业网络、或需要加密 STUN 消息的场景。启用步骤：
#   1) 申请证书（如 Caddy/certbot 的 fullchain.pem + privkey.pem）；
#   2) 在 docker-compose.yml 的 coturn.volumes 追加挂载证书目录；
#   3) 取消下面注释并填路径，同时取消上方 tls-listening-port 的注释。
#cert=/etc/coturn/certs/fullchain.pem
#pkey=/etc/coturn/certs/privkey.pem
# 若确定不使用 TLS/DTLS，也可显式禁用（省去证书加载尝试）：
#no-tls
#no-dtls

# ------------------------------ 安全加固 --------------------------------------
# 禁止中继到组播地址
no-multicast-peers
# 禁止中继到回环地址：现代 coturn（>=4.5.2）默认已禁止回环 peer，此处不重复声明；
# 仅当内网调试确有需要时才显式放开（生产保持关闭）：
#allow-loopback-peers
# 关闭 CLI 控制套接字（容器内无必要，减少攻击面）
no-cli
# 生产建议：禁止中继到内网网段，防止 TURN 被当作"内网探测跳板"（SSRF）
# 注意：若你的合法用户就在同一内网（如公司内网部署），请保持注释！
#denied-peer-ip=10.0.0.0-10.255.255.255
#denied-peer-ip=172.16.0.0-172.31.255.255
#denied-peer-ip=192.168.0.0-192.168.255.255
# 单用户/全局并发配额（防滥用，按需调整）：
#user-quota=12
#total-quota=1200
# nonce 防重放（默认 600 秒过期，一般无需修改）
#stale-nonce

# ------------------------------ 日志说明 --------------------------------------
# 容器内以前台方式运行（未启用 -o/--daemon），日志默认输出到 stdout/stderr：
#   docker compose -f deploy/docker-compose.yml logs -f coturn
# 特殊值 stdout/stderr 可显式指定日志去向（默认行为已满足，留作备忘）：
#log-file=stdout
# 调试排障时可打开详细日志：
#verbose
# 时间戳格式（可选）：
#new-log-timestamp
