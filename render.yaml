services:
  - type: web
    name: veiltalk
    runtime: docker
    dockerfilePath: ./Dockerfile.all
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      # prisma 兜底（免费层磁盘易失，SQLite 落 /tmp）
      - key: DATABASE_URL
        value: file:/tmp/veiltalk.db
